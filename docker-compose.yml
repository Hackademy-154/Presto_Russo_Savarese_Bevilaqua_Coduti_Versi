name: presto_hackademy

x-php-build: &php-build
  context: .
  dockerfile: Dockerfile
  args:
    UID: ${UID:-1000}
    GID: ${GID:-1000}
    TZ: ${TZ:-Europe/Rome}

x-laravel-env: &laravel-env
  APP_ENV: ${APP_ENV}
  APP_DEBUG: ${APP_DEBUG}
  APP_URL: ${APP_URL}
  TZ: ${TZ:-Europe/Rome}
  DB_CONNECTION: mysql
  DB_HOST: mysql
  DB_PORT: 3306
  DB_DATABASE: ${DB_DATABASE}
  DB_USERNAME: ${DB_USERNAME}
  DB_PASSWORD: ${DB_PASSWORD}
  CACHE_DRIVER: ${CACHE_DRIVER}
  QUEUE_CONNECTION: ${QUEUE_CONNECTION}
  SESSION_DRIVER: ${SESSION_DRIVER}
  REDIS_HOST: redis
  REDIS_PORT: 6379
  MAIL_MAILER: smtp
  MAIL_HOST: mailpit
  MAIL_PORT: 1025
  MAIL_USERNAME: ${MAIL_USERNAME}
  MAIL_PASSWORD: ${MAIL_PASSWORD}
  MAIL_ENCRYPTION: ${MAIL_ENCRYPTION}
  MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS}
  MAIL_FROM_NAME: ${MAIL_FROM_NAME}

services:
  laravel:
    build: *php-build
    image: laravel-app:php82
    container_name: laravel_app
    restart: unless-stopped
    env_file: [.env]
    environment: { <<: *laravel-env }
    volumes:
      - ./:/var/www/html
      - php-sock:/run/php
    depends_on: [mysql, redis]

  queue:
    build: *php-build
    image: laravel-app:php82
    container_name: laravel_queue
    restart: unless-stopped
    working_dir: /var/www/html
    command: php artisan queue:work --tries=1 --timeout=90
    env_file: [.env]
    environment: { <<: *laravel-env }
    volumes:
      - ./:/var/www/html
      - php-sock:/run/php
    depends_on: [laravel, redis, mysql]

  scheduler:
    build: *php-build
    image: laravel-app:php82
    container_name: laravel_scheduler
    restart: unless-stopped
    working_dir: /var/www/html
    command: sh -c "php artisan schedule:work"
    env_file: [.env]
    environment: { <<: *laravel-env }
    volumes:
      - ./:/var/www/html
      - php-sock:/run/php
    depends_on: [laravel, redis, mysql]

  nginx:
    image: nginx:1.27-alpine
    container_name: laravel_nginx
    restart: unless-stopped
    ports:
      - "${FORWARD_HTTP_PORT:-8080}:80"
    environment:
      TZ: ${TZ:-Europe/Rome}
    volumes:
      - ./:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - php-sock:/run/php
    depends_on: [laravel]

  mysql:
    image: mysql:8.0
    container_name: laravel_mysql
    restart: unless-stopped
    command: --default-authentication-plugin=mysql_native_password --sql_mode=""
    env_file: [.env]
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: ${DB_DATABASE}
      TZ: ${TZ:-Europe/Rome}
    ports:
      - "${FORWARD_DB_PORT:-3307}:3306"
    volumes:
      - mysql-data:/var/lib/mysql

  redis:
    image: redis:7-alpine
    container_name: laravel_redis
    restart: unless-stopped
    ports:
      - "${FORWARD_REDIS_PORT:-6379}:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data

  mailpit:
    image: axllent/mailpit:latest
    container_name: laravel_mailpit
    restart: unless-stopped
    ports:
      - "${FORWARD_MAILPIT_WEB_PORT:-8025}:8025"
      - "${FORWARD_MAILPIT_SMTP_PORT:-1025}:1025"

  node:
    build:
      context: .
      dockerfile: docker/node.Dockerfile
    container_name: laravel_node
    working_dir: /var/www/html
    # avvia come root per sistemare i volumi, poi passa a node
    user: "root"
    environment:
      NODE_OPTIONS: --max-old-space-size=1536
      NPM_CONFIG_CACHE: /home/node/.npm
    volumes:
      - ./:/var/www/html
      - node_modules:/var/www/html/node_modules
      - npm_cache:/home/node/.npm
    command: >
      sh -lc '
        mkdir -p /var/www/html/node_modules /home/node/.npm &&
        chown -R node:node /var/www/html/node_modules /home/node/.npm ||
          echo "WARN: chown fallito, continuo..." ;
        su -s /bin/sh -c "npm ci && npm run dev -- --host" node
      '
    ports:
      - "${FORWARD_VITE_PORT:-5173}:5173"
    depends_on:
      - laravel


  phpmyadmin:
    image: phpmyadmin:5.2-apache
    container_name: laravel_phpmyadmin
    restart: unless-stopped
    profiles: ["tools"]
    env_file: [.env]
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      PMA_USER: ${DB_USERNAME}
      PMA_PASSWORD: ${DB_PASSWORD}
      UPLOAD_LIMIT: 256M
    ports:
      - "${FORWARD_PHPMYADMIN_PORT:-9999}:80"
    depends_on: [mysql]

volumes:
  mysql-data:
  redis-data:
  php-sock:
  node_modules:
  npm_cache:
